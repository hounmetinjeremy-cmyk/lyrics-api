<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0f172a">
  <title>Lyrics Finder</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <header>
      <h1>🎵 Lyrics Finder</h1>
      <p>Shazam-like pour les paroles</p>
    </header>

    <main>
      <div class="tabs">
        <button class="tab active" data-tab="text">Paroles par titre</button>
        <button class="tab" data-tab="listen">🎤 Écouter</button>
      </div>

      <section id="panel-text" class="panel active">
        <input type="text" id="artist" placeholder="Nom de l'artiste">
        <input type="text" id="title" placeholder="Titre de la chanson">
        <button id="btnSearch" class="btn-primary">Rechercher les paroles</button>
        <p class="hint">Sources : lyrics.ovh, Genius, AZLyrics, SongLyrics, Musixmatch, Paroles.net...</p>
        <div id="resultText" class="result">Les paroles apparaîtront ici...</div>
      </section>

      <section id="panel-listen" class="panel">
        <div class="listen-card">
          <div class="pulse-ring" id="pulseRing"></div>
          <button id="btnListen" class="btn-listen">🎙️ Appuyer pour écouter</button>
          <p class="hint">Écoute 10 secondes et trouve automatiquement les paroles.</p>
          <div id="listenStatus">Appuyez sur le bouton ci-dessus</div>
        </div>
        <div id="resultListen" class="result"></div>
      </section>
    </main>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
